[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-wallet-risk"
version = "0.0.0"
description = "Reproducible foundation for point-in-time Solana wallet-risk research"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "joblib==1.5.3",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "matplotlib==3.10.9",
    "nbconvert==7.17.1",
    "pytest==7.4.4",
    "seaborn==0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["solana_risk*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
