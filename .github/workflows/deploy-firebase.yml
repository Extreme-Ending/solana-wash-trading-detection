name: Deploy Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA on main to publish
        required: true
        type: string
      release:
        description: Hosting destination
        required: true
        type: choice
        options:
          - preview
          - live
      confirmation:
        description: Type HOSTING-PREVIEW or HOSTING-LIVE to confirm
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: firebase-hosting-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate revision and matching CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Enforce main, immutable SHA, and explicit release confirmation
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          RELEASE_KIND: ${{ inputs.release }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_REPOSITORY: Extreme-Ending/solana-wash-trading-detection
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]]
          [[ "$GITHUB_SHA" == "$DEPLOY_REVISION" ]]
          if [[ "$RELEASE_KIND" == "preview" ]]; then
            [[ "$DEPLOY_CONFIRMATION" == "HOSTING-PREVIEW" ]]
          else
            [[ "$RELEASE_KIND" == "live" && "$DEPLOY_CONFIRMATION" == "HOSTING-LIVE" ]]
          fi
      - name: Require a successful CI run for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$DEPLOY_REVISION" -f branch=main -f status=completed -f per_page=100 \
            > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$DEPLOY_REVISION" \
            '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci-runs.json" >/dev/null

  deploy:
    name: Build and publish Hosting
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: ${{ inputs.release == 'live' && 'production' || 'hosting-preview' }}
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      COST_CONTROL_ATTESTATION: ${{ vars.COST_CONTROL_ATTESTATION }}
      FIREBASE_CLI_VERSION: 15.33.0
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate the release configuration
        run: python3 scripts/validate_release_config.py --mode firebase-${{ inputs.release }}
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify Firebase ADC and the exact Hosting site
        run: |
          set -euo pipefail
          npm exec --yes --package="firebase-tools@${FIREBASE_CLI_VERSION}" -- \
            firebase hosting:sites:list --project "$FIREBASE_PROJECT_ID" --non-interactive --json \
            > "$RUNNER_TEMP/firebase-sites.json"
          jq -e --arg site "$FIREBASE_HOSTING_SITE" \
            '.result.sites | any(.name == ("projects/" + $site + "/sites/" + $site))' \
            "$RUNNER_TEMP/firebase-sites.json" >/dev/null
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build and inspect the production frontend
        run: |
          set -euo pipefail
          npm --prefix frontend run build
          python3 scripts/validate_deployment_bundle.py frontend/dist
      - name: Publish an expiring Hosting preview
        if: inputs.release == 'preview'
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          channel="sha-${DEPLOY_REVISION:0:12}"
          npm exec --yes --package="firebase-tools@${FIREBASE_CLI_VERSION}" -- \
            firebase hosting:channel:deploy "$channel" --expires 7d \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --json
      - name: Publish the explicitly approved live Hosting release
        if: inputs.release == 'live'
        run: >-
          npm exec --yes --package="firebase-tools@${FIREBASE_CLI_VERSION}" --
          firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID"
          --non-interactive --json
