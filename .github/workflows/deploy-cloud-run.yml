name: Deploy private Cloud Run pilot

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA on main to deploy
        required: true
        type: string
      confirmation:
        description: Type PRIVATE-PILOT to confirm the protected deployment
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: cloud-run-private-pilot
  cancel-in-progress: false

jobs:
  gate:
    name: Validate revision and matching CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Enforce main, immutable SHA, and explicit confirmation
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_REPOSITORY: Extreme-Ending/solana-wash-trading-detection
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$DEPLOY_CONFIRMATION" == "PRIVATE-PILOT" ]]
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_REVISION" ]]
          [[ "$GITHUB_SHA" == "$DEPLOY_REVISION" ]]
      - name: Require a successful CI run for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$DEPLOY_REVISION" -f branch=main -f status=completed -f per_page=100 \
            > "$RUNNER_TEMP/ci-runs.json"
          jq -e --arg sha "$DEPLOY_REVISION" \
            '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' \
            "$RUNNER_TEMP/ci-runs.json" >/dev/null

  deploy:
    name: Build, publish, and deploy private pilot
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: private-pilot
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
      ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_HOSTING_SITE: ${{ vars.FIREBASE_HOSTING_SITE }}
      COST_CONTROL_ATTESTATION: ${{ vars.COST_CONTROL_ATTESTATION }}
      SOLANA_RISK_ALLOWED_UIDS: ${{ secrets.SOLANA_RISK_ALLOWED_UIDS }}
      SOLANA_RISK_ENABLE_EXPERIMENTAL_SCORING: "false"
      MAX_INSTANCES: "2"
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Validate the release configuration
        run: python3 scripts/validate_release_config.py --mode cloud-run
      - name: Authenticate to Google Cloud with WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Install the reviewed Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Verify billing, APIs, identities, and registry
        run: |
          set -euo pipefail
          [[ "$(gcloud billing projects describe "$GCP_PROJECT_ID" --format='value(billingEnabled)')" == "True" ]]
          enabled="$(gcloud services list --enabled --project "$GCP_PROJECT_ID" --format='value(config.name)')"
          for api in artifactregistry.googleapis.com iamcredentials.googleapis.com run.googleapis.com sts.googleapis.com; do
            grep -Fxq "$api" <<<"$enabled"
          done
          gcloud artifacts repositories describe "$ARTIFACT_REGISTRY_REPOSITORY" \
            --project "$GCP_PROJECT_ID" --location "$GCP_REGION" \
            --format='value(format)' | grep -Fxq DOCKER
          runtime_disabled="$(gcloud iam service-accounts describe "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --project "$GCP_PROJECT_ID" --format='value(disabled)')"
          deploy_disabled="$(gcloud iam service-accounts describe "$GCP_DEPLOY_SERVICE_ACCOUNT" \
            --project "$GCP_PROJECT_ID" --format='value(disabled)')"
          [[ -z "$runtime_disabled" || "${runtime_disabled,,}" == "false" ]]
          [[ -z "$deploy_disabled" || "${deploy_disabled,,}" == "false" ]]
      - name: Build and smoke-test the production image
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          python3 scripts/container_smoke_test.py \
            --image "solana-wallet-risk-api:${DEPLOY_REVISION}" \
            --host-port 18082 --custom-host-port 18083
      - name: Push the immutable commit image
        id: image
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          image_root="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REGISTRY_REPOSITORY}/solana-wallet-risk-api"
          image_tag="${image_root}:${DEPLOY_REVISION}"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker tag "solana-wallet-risk-api:${DEPLOY_REVISION}" "$image_tag"
          docker push "$image_tag"
          digest="$(gcloud artifacts docker images describe "$image_tag" --format='value(image_summary.digest)')"
          python3 scripts/validate_release_config.py --mode image-digest --image-digest "$digest"
          printf 'image_root=%s\nimage_tag=%s\ndigest=%s\n' "$image_root" "$image_tag" "$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy the exact digest with the Invoker IAM check intact
        env:
          DEPLOY_REVISION: ${{ inputs.revision }}
          IMAGE_ROOT: ${{ steps.image.outputs.image_root }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${IMAGE_ROOT}@${IMAGE_DIGEST}" \
            --platform managed \
            --no-allow-unauthenticated \
            --cpu-throttling \
            --min 0 --max "$MAX_INSTANCES" \
            --cpu 1 --memory 512Mi --concurrency 20 --timeout 30s --port 8080 \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --revision-suffix "${DEPLOY_REVISION:0:12}" \
            --labels "managed-by=github-actions,git-sha=${DEPLOY_REVISION}" \
            --set-env-vars "^@^SOLANA_RISK_ENVIRONMENT=production@SOLANA_RISK_ENABLE_EXPERIMENTAL_SCORING=false@SOLANA_RISK_CORS_ORIGINS=https://${FIREBASE_HOSTING_SITE}.web.app,https://${FIREBASE_HOSTING_SITE}.firebaseapp.com@SOLANA_RISK_MAX_EVENTS=100@SOLANA_RISK_MAX_BATCH_WALLETS=20@SOLANA_RISK_MAX_BATCH_EVENTS=100@SOLANA_RISK_MAX_BATCH_EVENTS_PER_WALLET=50@SOLANA_RISK_MAX_REQUEST_BYTES=262144@SOLANA_RISK_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}@SOLANA_RISK_ALLOWED_UIDS=${SOLANA_RISK_ALLOWED_UIDS}@SOLANA_RISK_CHECK_REVOKED_TOKENS=true@SOLANA_RISK_RATE_LIMIT_REQUESTS=30@SOLANA_RISK_RATE_LIMIT_WINDOW_SECONDS=60"
      - name: Verify the private service and deployed digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(spec.template.spec.containers[0].image)')"
          [[ "$deployed_image" == *@"$IMAGE_DIGEST" ]]
          service_url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          identity_token="$(gcloud auth print-identity-token --audiences="$service_url")"
          curl --fail --silent --show-error --header "Authorization: Bearer ${identity_token}" "${service_url}/healthz" \
            | jq -e '.status == "ok"' >/dev/null
          ready_status="$(curl --silent --output "$RUNNER_TEMP/ready.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${identity_token}" "${service_url}/readyz")"
          [[ "$ready_status" == "503" ]]
          jq -e '.error.code == "MODEL_NOT_APPROVED"' "$RUNNER_TEMP/ready.json" >/dev/null
          anonymous_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "${service_url}/healthz")"
          [[ "$anonymous_status" == "401" || "$anonymous_status" == "403" ]]
          printf 'Verified private Cloud Run service URL: %s\n' "$service_url"
